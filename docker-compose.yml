# ===== Sidekick AI — local dev stack =====
# Postgres 16 + pgvector (extension vector) cho RAG.
# Docs: docs/SYSTEM_DESIGN.md §5

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sidekick-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sidekick}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sidekick_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-sidekick}
      # Locale + timezone de output kiem do la duy nhat
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - sidekick-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sidekick} -d ${POSTGRES_DB:-sidekick}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - sidekick-net

volumes:
  sidekick-pgdata:
    name: sidekick-pgdata

networks:
  sidekick-net:
    name: sidekick-net
    driver: bridge
